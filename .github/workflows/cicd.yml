name: Build Push Deploy HealthAI Frontend

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on:
      - self-hosted
      - healthai-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Tags
        run: git fetch --tags

      - name: Generate Version
        run: |
          PREFIX="healthai-frontend-v"
          LAST_TAG=$(git tag -l "${PREFIX}*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            VERSION="1.0.0"
          else
            VERSION=${LAST_TAG#${PREFIX}}
            IFS='.' read MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IMAGE_TAG="${PREFIX}${VERSION}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Generated Version: $IMAGE_TAG"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${IMAGE_TAG}"
          git push origin "${IMAGE_TAG}"

      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t pradeepsmartncode/lawairepo:${IMAGE_TAG} \
            -t pradeepsmartncode/lawairepo:healthai-frontend-latest \
            .

      - name: Push Version Image
        run: |
          docker push pradeepsmartncode/lawairepo:${IMAGE_TAG}

      - name: Push Latest Image
        run: |
          docker push pradeepsmartncode/lawairepo:healthai-frontend-latest

      # - name: Deploy Application
